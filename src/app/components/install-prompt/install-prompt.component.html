<div *ngIf="showPrompt" class="fixed bottom-5 left-5 right-5 md:left-auto md:right-5 md:bottom-5 md:w-96
            bg-card border border-color rounded-xl shadow-2xl p-4 z-50
            flex items-center justify-between gap-4
            animate-slideUp" [style.background-color]="'var(--bg-card)'" [style.border-color]="'var(--border-color)'">

    <div class="flex items-center gap-3 flex-1">
        <!-- App Icon/Emoji -->
        <span class="text-3xl animate-bounce-subtle">📱</span>

        <!-- Message -->
        <p class="text-primary text-sm font-medium">
            Install Pokédex app for offline use!
        </p>
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center gap-2">
        <button class="px-4 py-2 rounded-lg text-sm font-medium
                       bg-blue-500 text-white
                       hover:bg-blue-600
                       transition-all duration-200
                       transform hover:scale-105 active:scale-95
                       shadow-md hover:shadow-lg
                       cursor-pointer" (click)="install()">
            Install
        </button>

        <button class="px-4 py-2 rounded-lg text-sm font-medium
                       bg-secondary text-secondary
                       hover:bg-gray-200 dark:hover:bg-gray-700
                       transition-all duration-200
                       cursor-pointer" (click)="dismiss()">
            Later
        </button>
    </div>
</div>

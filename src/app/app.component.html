<div class="app-container">
  <!-- Header with navigation and settings -->
  <header class="app-header">
    <div class="logo" routerLink="/">
      <h1>Pokédex</h1>
    </div>

    <div class="header-actions">
      <!-- Favorites icon with counter -->
      <button class="icon-btn" (click)="toggleFavorites()" [class.active]="showFavorites">
        <span class="favorite-icon">⭐</span>
        <span class="badge" *ngIf="((favoritesCount$ | async) ?? 0) > 0">
          {{ (favoritesCount$ | async) ?? 0 }}
        </span>
      </button>

      <!-- Compare icon with counter -->
      <button class="icon-btn" (click)="toggleCompare()">
        <span class="compare-icon">🔄</span>
        <span class="badge" *ngIf="((compareCount$ | async) ?? 0) > 0">
          {{ (compareCount$ | async) ?? 0 }}
        </span>
      </button>

      <!-- Settings button that toggles the panel -->
      <button class="icon-btn settings-btn" (click)="toggleSettings()">
        <span class="settings-icon">⚙️</span>
      </button>
    </div>
  </header>

  <!-- Settings Panel (slides in from right) -->
  <div class="settings-overlay" *ngIf="showSettings" (click)="closeSettings()"></div>
  <div class="settings-panel" [class.open]="showSettings">
    <div class="settings-header">
      <h2>Settings</h2>
      <button class="close-btn" (click)="closeSettings()">✕</button>
    </div>
    <app-settings></app-settings>
  </div>

  <!-- Main content area -->
  <main>
    <router-outlet></router-outlet>
  </main>

  <!-- Compare panel (if you implemented it) -->
  <app-compare *ngIf="showCompare"></app-compare>
  <app-favourites *ngIf="showFavorites"></app-favourites>
</div>
